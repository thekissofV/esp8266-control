<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macerator Control Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --green: #10b981;
            --red: #ef4444;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        h1 { font-size: 1.5rem; margin: 0; }
        .pill { padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; border: 1px solid var(--border); }
        .logout-btn { color: var(--red); text-decoration: none; font-size: 0.9rem; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title { font-weight: bold; font-size: 1.1rem; }
        .status-badge { font-weight: bold; font-size: 0.9rem; }

        .progress-bg {
            background-color: #0f172a;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-on { background-color: var(--green); color: white; }
        .btn-off { background-color: var(--red); color: white; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Macerator Control</h1>
            <span id="connectionPill" class="pill">Cloud Sync: Connecting...</span>
        </div>
        <a href="/logout" class="logout-btn">Logout</a>
    </header>

    <!-- Node 2 Sensor Card -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">Hopper Level (Node 2)</span>
            <span id="sensorValueDisplay" class="status-badge" style="color: var(--accent);">-- cm</span>
        </div>
        <div id="levelText" style="font-size: 0.85rem; color: var(--text-muted);">0% Full</div>
        <div class="progress-bg">
            <div id="levelBar" class="progress-fill"></div>
        </div>
    </div>

    <!-- Controls Grid -->
    <div class="grid">
        <!-- Relay 1: System Power -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">System Power</span>
                <span id="status1" class="status-badge">OFFLINE</span>
            </div>
            <div class="btn-group">
                <button class="btn-on" onclick="setRelay(1, true)">POWER ON</button>
                <button class="btn-off" onclick="setRelay(1, false)">POWER OFF</button>
            </div>
        </div>

        <!-- Relay 2: Main Motor -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Main Motor</span>
                <span id="status2" class="status-badge">STOPPED</span>
            </div>
            <div class="btn-group">
                <button id="btnOn2" class="btn-on" onclick="setRelay(2, true)">START</button>
                <button id="btnOff2" class="btn-off" onclick="setRelay(2, false)">STOP</button>
            </div>
        </div>

        <!-- Relay 3: Drill Actuator -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Drill Actuator</span>
                <span id="status3" class="status-badge">STOPPED</span>
            </div>
            <div class="btn-group">
                <button id="btnOn3" class="btn-on" onclick="setRelay(3, true)">START</button>
                <button id="btnOff3" class="btn-off" onclick="setRelay(3, false)">STOP</button>
            </div>
        </div>

        <!-- Relay 4: Solenoid Water Valve -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Solenoid Valve</span>
                <span id="status4" class="status-badge">CLOSED</span>
            </div>
            <div class="btn-group">
                <button id="btnOn4" class="btn-on" onclick="setRelay(4, true)">OPEN</button>
                <button id="btnOff4" class="btn-off" onclick="setRelay(4, false)">CLOSE</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function fetchState() {
        try {
            // cache: 'no-store' forces browser to get fresh state every second
            const res = await fetch('/api/state', { cache: 'no-store' });
            if (res.status === 401) {
                window.location.href = '/login.html';
                return;
            }
            const data = await res.json();
            
            document.getElementById('connectionPill').innerText = 'Cloud Sync: Active';
            document.getElementById('connectionPill').style.borderColor = '#10b981';

            // Update Sensor Telemetry
            const dist = data.node2Distance || 0;
            document.getElementById('sensorValueDisplay').innerText = dist + ' cm';
            
            const isOverflow = (dist > 0 && dist <= 22);

            // 1. System Power Status
            updateStatusText('status1', data.relay1, 'ONLINE', 'OFFLINE');

            // Visually disable sub-system START buttons when System Power is OFF
            document.getElementById('btnOn2').disabled = !data.relay1;
            document.getElementById('btnOn3').disabled = !data.relay1;
            document.getElementById('btnOn4').disabled = !data.relay1;

            // 2. Main Motor Status (Detect Latched Overflow Trip)
            const status2El = document.getElementById('status2');
            if (isOverflow && !data.relay2) {
                status2El.innerText = 'OVERFLOW TRIP (<=22cm)';
                status2El.style.color = 'var(--red)';
            } else {
                updateStatusText('status2', data.relay2, 'RUNNING', 'STOPPED');
            }

            // 3. Drill Actuator Status
            const status3El = document.getElementById('status3');
            if (isOverflow && !data.relay3) {
                status3El.innerText = 'OVERFLOW TRIP (<=22cm)';
                status3El.style.color = 'var(--red)';
            } else {
                updateStatusText('status3', data.relay3, 'RUNNING', 'STOPPED');
            }

            // 4. Solenoid Valve Status
            updateStatusText('status4', data.relay4, 'OPEN', 'CLOSED');

            // Progress Bar Fill Logic (Assuming 50 cm max bin depth)
            let fillPercent = Math.max(0, Math.min(100, Math.round(((50 - dist) / 50) * 100)));
            if (dist === 0) fillPercent = 0;
            
            const levelBar = document.getElementById('levelBar');
            levelBar.style.width = fillPercent + '%';
            levelBar.style.backgroundColor = isOverflow ? 'var(--red)' : 'var(--accent)';
            document.getElementById('levelText').innerText = fillPercent + '% Full (' + dist + ' cm distance)';

        } catch (err) {
            document.getElementById('connectionPill').innerText = 'Cloud Sync: Error';
            document.getElementById('connectionPill').style.borderColor = 'var(--red)';
        }
    }

    function updateStatusText(elementId, state, onText, offText) {
        const el = document.getElementById(elementId);
        el.innerText = state ? onText : offText;
        el.style.color = state ? 'var(--green)' : 'var(--text-muted)';
    }

    async function setRelay(relay, state) {
        try {
            const res = await fetch('/api/relay', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ relay, state })
            });
            const data = await res.json();
            if (!res.ok) {
                alert(data.error || 'Operation failed');
            }
            fetchState();
        } catch (err) {
            alert('Failed to send command to server');
        }
    }

    // Refresh dashboard state every 1 second
    setInterval(fetchState, 1000);
    fetchState();
</script>

</body>
</html>
