<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ESP8266 Control Dashboard</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
}

.card {
    background: white;
    margin: 20px 0;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 10px #bbb;
}

h1 {
    margin-bottom: 30px;
}

h2 {
    margin-bottom: 15px;
}

.status {
    font-size: 24px;
    font-weight: bold;
    margin: 15px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 15px 30px;
    margin: 5px;
    font-size: 18px;
    cursor: pointer;
}

.on {
    background: #28a745;
    color: white;
}

.off {
    background: #dc3545;
    color: white;
}

.logout {
    background: #333;
    color: white;
}

.login-box input {
    display: block;
    width: 90%;
    max-width: 350px;
    margin: 10px auto;
    padding: 12px;
    font-size: 16px;
    box-sizing: border-box;
}

.login-box button {
    background: #333;
    color: white;
}

#loginError {
    color: red;
}

</style>

</head>

<body>

<div class="container">

<h1>ESP8266 Control</h1>

<!-- LOGIN -->

<div id="loginBox" class="card login-box">

<h2>Login</h2>

<form id="loginForm">

<input
    type="text"
    name="username"
    placeholder="Username"
    required


<input
    type="password"
    name="password"
    placeholder="Password"
    required


<button type="submit">
LOGIN
</button>

</form>

<p id="loginError"></p>

</div>


<!-- DASHBOARD -->

<div id="dashboard" style="display:none;">

<div class="card">

<h2>Relay 1</h2>

<div class="status">

Status:
<span id="relay1Status">OFF</span>

</div>

<button
    class="on"
    onclick="setRelay(1, true)">
    ON
</button>

<button
    class="off"
    onclick="setRelay(1, false)">
    OFF
</button>

</div>


<div class="card">

<h2>Relay 2</h2>

<div class="status">

Status:
<span id="relay2Status">OFF</span>

</div>

<button
    class="on"
    onclick="setRelay(2, true)">
    ON
</button>

<button
    class="off"
    onclick="setRelay(2, false)">
    OFF
</button>

</div>


<div class="card">

<button
    class="logout"
    onclick="logout()">
    LOGOUT
</button>

</div>

</div>

</div>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const formData = new FormData(this);

    const response = await fetch("/login", {

        method: "POST",

        body: new URLSearchParams(formData)

    });

    if (response.ok || response.redirected) {

        showDashboard();

        updateStatus();

    } else {

        document
        .getElementById("loginError")
        .innerText =
        "Invalid username or password";

    }

});


async function checkLogin() {

    const response =
        await fetch("/api/state");

    if (response.ok) {

        showDashboard();

        updateStatus();

    }

}


function showDashboard() {

    document
    .getElementById("loginBox")
    .style.display = "none";

    document
    .getElementById("dashboard")
    .style.display = "block";

}


async function setRelay(relay, state) {

    const response = await fetch("/api/relay", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            relay: relay,
            state: state
        })

    });

    if (response.ok) {

        updateStatus();

    }

}


async function updateStatus() {

    const response =
        await fetch("/api/state");

    if (!response.ok) {
        return;
    }

    const data =
        await response.json();

    document
    .getElementById("relay1Status")
    .innerText =
    data.relay1 ? "ON" : "OFF";

    document
    .getElementById("relay2Status")
    .innerText =
    data.relay2 ? "ON" : "OFF";

}


// Automatically update the dashboard every 1 second

setInterval(updateStatus, 1000);


function logout() {

    window.location.href = "/logout";

}


checkLogin();

</script>

</body>

</html>
